syntax = "proto3";

package inventory.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/Production-Ready_Microservices_Architecture/shared/pkg/proto/inventory/v1;inventoryv1";

// InventoryService управляет каталогом деталей для космических кораблей
service InventoryService {
  // GetPart возвращает деталь по UUID
  rpc GetPart(GetPartRequest) returns (GetPartResponse) {
    option (google.api.http) = {get: "/api/v1/inventory/part/{uuid}"};
  }
  // ListParts возвращает список деталей корабля
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse) {
    option (google.api.http) = {get: "/api/v1/inventory/parts"};
  }
}

// Тип детали
enum PartType {
  // Не указан
  PART_TYPE_UNSPECIFIED = 0;
  // Корпус корабля
  PART_TYPE_HULL = 1;
  // Двигатель
  PART_TYPE_ENGINE = 2;
  // Защитный щит
  PART_TYPE_SHIELD = 3;
  // Вооружение
  PART_TYPE_WEAPON = 4;
}

// Part представляет деталь космического корабля
message Part {
  // Уникальный идентификатор детали
  string uuid = 1;
  // Название детали
  string name = 2;
  // Описание детали
  string description = 3;
  // Цена в копейках (5000₽ = 500000)
  int64 price = 4;
  // Тип детали (enum)
  PartType part_type = 5;
  // Количество на складе
  int64 stock_quantity = 6;
  // Дата создания
  google.protobuf.Timestamp created_at = 7;
}

// Запрос на получение детали по UUID
message GetPartRequest {
  // UUID детали
  string uuid = 1;
}
message GetPartResponse {
  // Информация о детали
  Part part = 1;
}

message ListPartsRequest {
  // Тип части корабля (enum)
  PartType part_type = 1;
  // Список UUID деталей корабля
  repeated string uuids = 2;
}
message ListPartsResponse {
  // Список деталей корабля
  repeated Part parts = 1;
}
